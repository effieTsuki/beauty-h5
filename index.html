<style>
  :root {
    --primary: #e0648c;
    --primary-bright: #f29ab8;
    --primary-deep: #b03a63;
    --primary-soft: #fceef3;
    --bg: #fdf5f7;

    --muted: #9c6b7e;
    --border: #f4dfe6;
    --danger: #dc2626;
    --shadow: 0 2px 6px rgba(190,90,125,.05), 0 10px 26px rgba(190,90,125,.09);

    --warm-gray: #f9eef2;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 90% 55% at 8% -8%, rgba(224,100,140,.14), transparent 60%),
      radial-gradient(ellipse 65% 45% at 96% 4%, rgba(180,142,201,.12), transparent 60%),

    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: calc(84px + var(--safe-bottom));
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; font-size: 15px; color: var(--text); }
  img { display: block; }

  /* ================= 顶栏 ================= */
  .header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,250,252,.8);
    backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-bottom: 1px solid rgba(244,223,230,.9);
    padding: 14px 16px 14px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, #f29ab8, #e0648c 55%, #c2466f);
    display: flex; align-items: center; justify-content: center;

  .brand .logo svg { width: 22px; height: 22px; stroke: #fff; }
  .brand h1 {
    margin: 0; font-size: 20px; font-weight: 800; letter-spacing: .3px;

  .brand .sub { font-size: 11px; color: var(--muted); margin-top: -2px; letter-spacing: .5px; }

  /* 统计卡片 */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 11px; margin-top: 14px; }
  .stat {

  .cats::-webkit-scrollbar { display: none; }
  .chip {

  .chip.on {

  /* ================= 工具栏 ================= */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; padding: 10px 16px 6px; gap: 6px 10px; }
  .toolbar .tags { display: flex; flex-wrap: wrap; gap: 6px; flex: 0 1 auto; }
  .tag {

  .tag:active { transform: scale(.93); }
  .tag.on {

  /* ================= 卡片网格 ================= */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; padding: 10px 16px 24px; }

  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
  .card .thumb {

    background: linear-gradient(140deg, #fce8ef 0%, #faf2f5 45%, #eee4fa 100%);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .thumb .ph { opacity: .55; }
  .card .cat-badge {
    position: absolute; top: 10px; left: 10px;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700;
    background: rgba(255,250,252,.85); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: #8d4a5e; box-shadow: 0 2px 8px rgba(190,90,125,.12);
  }
  .card .cat-badge::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;

  .card .del {
    position: absolute; top: 8px; right: 8px; width: 27px; height: 27px;

  .card:active .del, .card:hover .del { opacity: 1; }
  .card .del svg { width: 13px; height: 13px; stroke: #fff; }
  .card .body { padding: 11px 12px 12px; }
  .card .name {

  }
  .card .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; min-height: 18px; }
  .ppill, .shpill, .cpill {

  .ppill { background: #e9f1fa; color: #5f7fa3; }

  .card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
  .price-badge {

  .price-badge small { font-size: 10px; font-weight: 600; opacity: .85; margin-right: 1px; }
  .age-pill { font-size: 11px; color: #a0788c; background: #f5eaf0; padding: 3px 8px; border-radius: 999px; font-weight: 500; max-width: 52%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .age-pill.soon { background: #faeedf; color: #c2661a; font-weight: 600; }
  .age-pill.over { background: #fce8e8; color: #dc2626; font-weight: 700; }

  /* ================= 空态 ================= */
  .empty { grid-column: 1 / -1; text-align: center; padding: 42px 20px 60px; }
  .empty .art {

  /* ================= FAB ================= */
  .fab {

    background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px rgba(224,100,140,.4);
    transition: transform .15s ease;

  .fab:active { transform: scale(.9); }
  .fab svg { width: 26px; height: 26px; stroke: #fff; stroke-width: 2.6; position: relative; z-index: 1; }
  .fab::before {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    background: radial-gradient(circle, rgba(240,150,180,.32), transparent 65%);
    animation: fabGlow 2.6s ease-in-out infinite; z-index: 0;

  @keyframes fabGlow { 0%,100% { opacity: .45; transform: scale(1) } 50% { opacity: 1; transform: scale(1.18) } }

  /* ================= 弹窗 ================= */
  .mask {
    position: fixed; inset: 0; z-index: 40; background: rgba(120,40,70,.45);

  .mask.show { opacity: 1; pointer-events: auto; }
  .sheet {

    background: rgba(255,250,252,.95);
    backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
    border-radius: 26px 26px 0 0; max-height: 92vh; overflow-y: auto;
    box-shadow: 0 -12px 44px rgba(150,45,85,.16);
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);

  .sheet.show { transform: translateY(0); }
  .sheet .grip { width: 42px; height: 4.5px; border-radius: 3px; background: #f0d7e0; margin: 11px auto 4px; }
  .sheet h2 { margin: 10px 22px 4px; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 7px; }
  .sheet h2::before {

  .sheet .form { padding: 8px 22px 0; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; font-weight: 600; }
  .field input[type=text], .field input[type=number], .field input[type=password], .field textarea {
    width: 100%; padding: 12px 14px; min-height: 46px; border-radius: 13px; border: 1.5px solid transparent;
    background: var(--warm-gray); outline: none; transition: border .15s ease, box-shadow .15s ease;
  }
  .date-field input[type=text] { min-height: 0; }
  .field input:focus, .field textarea:focus {
    border-color: var(--primary-bright);
    box-shadow: 0 0 0 4px rgba(224,100,140,.15);
  }
  .field textarea { resize: none; min-height: 64px; }

  /* 日期选择字段（点击弹自定义日历） */
  .date-field {
    display: flex; align-items: center; gap: 9px;
    padding: 12px 14px; min-height: 46px; border-radius: 13px; border: 1.5px solid transparent;
    background: var(--warm-gray);
    transition: border .15s ease, box-shadow .15s ease;
  }
  .date-field:focus-within { border-color: var(--primary-bright); box-shadow: 0 0 0 4px rgba(224,100,140,.15); }
  .date-field svg { width: 17px; height: 17px; stroke: var(--primary); flex: 0 0 auto; cursor: pointer; }
  .date-field input[type=text] {
    flex: 1; border: none; outline: none; background: transparent; padding: 0;
    font-size: 14.5px; color: var(--text); min-width: 0;
  }
  .date-field input::placeholder { color: #d8b8c6; }
  .date-field .clear-btn {
    display: none; width: 18px; height: 18px; border-radius: 50%;
    background: #f0d7e0; color: #a06f82; font-size: 11px; line-height: 1;
    align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .date-field.has-value .clear-btn { display: flex; }

  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg .opt {
    padding: 8px 15px; border-radius: 999px; background: var(--warm-gray); border: 1.5px solid transparent;
    font-size: 13px; color: var(--muted); transition: all .15s ease;

  .seg .opt:active { transform: scale(.93); }
  .seg .opt.on {

    box-shadow: 0 4px 14px rgba(224,100,140,.3);
  }
  /* 上传框 */
  .upload { display: flex; align-items: center; gap: 13px; }
  .upload .box {
    width: 84px; height: 84px; border-radius: 16px; border: 1.5px dashed #e8bcc9;
    background: linear-gradient(140deg, #fdf5f8, #fae9f0);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--muted); font-size: 11px; gap: 4px; overflow: hidden; position: relative;
    transition: border .15s ease, transform .15s ease;

  .upload .box:active { transform: scale(.95); border-color: var(--primary-bright); }
  .upload .box svg { width: 22px; height: 22px; stroke: #d98aa6; }

  .upload .box .rm {
    position: absolute; top: 4px; right: 4px; width: 19px; height: 19px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .upload .tip { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .upload .tip b { color: var(--primary-deep); }

  .sheet .actions { display: flex; gap: 11px; padding: 10px 22px 0; }
  .btn {
    flex: 1; padding: 14px; border-radius: 15px; font-size: 15px; font-weight: 700;
    text-align: center; transition: all .15s ease;

  .btn:active { transform: scale(.97); }
  .btn.ghost { background: #f4e6ec; color: var(--muted); }

  .btn.primary:disabled { opacity: .55; box-shadow: none; }
  .btn.danger { background: linear-gradient(135deg, #f87171, #ef4444); color: #fff; box-shadow: 0 6px 18px rgba(239,68,68,.35); }

  /* 确认弹窗 */
  .dialog {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.92); z-index: 45;
    background: rgba(255,250,252,.96); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border-radius: 22px; padding: 24px 22px 20px; width: 82%; max-width: 320px; text-align: center;
    box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: all .2s ease;
  }
  .dialog.show { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(1); }
  .dialog p { margin: 4px 0 18px; font-size: 15px; font-weight: 600; }

  /* ================= 自定义日历弹层 ================= */
  .cal-mask {
    position: fixed; inset: 0; z-index: 50; background: rgba(120,40,70,.45);
    backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .cal-mask.show { opacity: 1; pointer-events: auto; }
  .cal-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
    background: rgba(255,250,252,.97);
    backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -12px 44px rgba(150,45,85,.18);
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);

  .cal-title { font-size: 16.5px; font-weight: 800; color: var(--text); letter-spacing: .5px; cursor: pointer; padding: 6px 10px; border-radius: 10px; transition: background .15s ease; }
  .cal-title:active { background: var(--warm-gray); }
  .cal-nav {
    width: 36px; height: 36px; border-radius: 12px; background: var(--warm-gray);
    font-size: 19px; color: var(--primary-deep); display: flex; align-items: center; justify-content: center;
    transition: all .15s ease;
  }
  .cal-nav:active { transform: scale(.9); }
  .cal-nav:disabled { opacity: .3; }
  .cal-week {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px;
  }
  .cal-week span { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 0; }
  .cal-week .wend { color: #d67a9c; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-d {
    aspect-ratio: 1/1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14.5px; color: var(--text); font-weight: 500;
    transition: all .12s ease; position: relative;
  }
  .cal-d:active { transform: scale(.88); }
  .cal-d.today::after {
    content: ''; position: absolute; inset: 2px; border-radius: 50%;
    border: 1.5px solid #f29ab8;
  }
  .cal-d.sel { background: var(--grad); color: #fff; font-weight: 800; box-shadow: 0 4px 12px rgba(224,100,140,.35); }
  .cal-d.sel.today::after { border-color: rgba(255,255,255,.85); }
  .cal-d:disabled { color: #f0dfe6; }
  .cal-weekend { color: #c2546a; }
  .cal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .cal-actions .btn.today-btn { background: var(--warm-gray); color: var(--primary-deep); flex: 0 0 auto; padding: 13px 18px; }

  /* 日历·年月选择面板（点标题进入） */
  .cal-ym { padding: 2px 0; }
  .cal-ym .ym-decade { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-ym .ym-decade .d-lbl { font-size: 14.5px; font-weight: 800; color: var(--text); letter-spacing: .5px; }
  .cal-ym .ym-lbl { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 7px; }
  .cal-ym .ym-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 13px; }
  .cal-ym .ym-opt {
    padding: 11px 0; border-radius: 12px; background: var(--warm-gray);
    font-size: 14px; color: var(--text); font-weight: 500; transition: all .12s ease;
  }
  .cal-ym .ym-opt:active { transform: scale(.93); }
  .cal-ym .ym-opt.on {
    background: var(--grad); color: #fff; font-weight: 700;
    box-shadow: 0 4px 14px rgba(224,100,140,.3);
  }
  .cal-ym .ym-opt:disabled { color: #f0dfe6; }

  /* 购入信息紧凑布局 */
  .buy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .buy-grid .field { margin-bottom: 15px; }

  /* 购入渠道字段（点击弹层选择） */
  .pf-field {
    display: flex; align-items: center; gap: 9px;
    padding: 12px 12px; min-height: 46px; border-radius: 13px; border: 1.5px solid transparent;
    background: var(--warm-gray); cursor: pointer;
    transition: border .15s ease, box-shadow .15s ease;

  .pf-field svg { width: 17px; height: 17px; stroke: var(--primary); flex: 0 0 auto; }
  .pf-field .pf-val { flex: 1; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pf-field .pf-val.unset { color: #d8b8c6; }
  .pf-field .pf-arrow { color: var(--primary); font-size: 14px; flex: 0 0 auto; }

  /* 渠道选择弹层 */
  .pf-list { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 4px 0 2px; }
  .pf-opt {
    padding: 12px 10px; border-radius: 13px; background: var(--warm-gray);
    font-size: 14px; color: var(--text); font-weight: 500;
    transition: all .15s ease;
  }
  .pf-opt:active { transform: scale(.93); }
  .pf-opt.on {
    background: var(--grad); color: #fff; font-weight: 700;
    box-shadow: 0 4px 14px rgba(224,100,140,.3);
  }

  /* 顶栏按钮组（导出 + 登录） */
  .header-actions { display: flex; gap: 8px; }

  /* 顶栏登录按钮 */
  .login-btn {
    width: 38px; height: 38px; border-radius: 12px;

  .login-btn svg { width: 19px; height: 19px; stroke: var(--muted); }
  .login-btn.on { background: var(--grad); border-color: transparent; box-shadow: 0 5px 14px rgba(224,100,140,.35); }
  .login-btn.on svg { stroke: #fff; }

  /* 登录弹层 */
  .link-btn { display: block; width: 100%; margin-top: 14px; font-size: 13px; color: var(--primary-deep); font-weight: 600; padding: 8px; text-decoration: underline; text-underline-offset: 3px; }
  .sync-tip { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; line-height: 1.65; }
  .sync-warn { font-size: 12.5px; color: #b03a63; margin: 6px 0 0; line-height: 1.65; font-weight: 600; }
  .sync-badge {
    display: flex; align-items: center; gap: 8px; padding: 13px 15px; border-radius: 13px;
    background: #f0f5e8; color: #5e7d4a; font-size: 14px; font-weight: 700; margin-bottom: 10px;
  }
  .login-sheet .btn.primary, .login-sheet .btn.ghost { width: 100%; margin-top: 8px; padding: 13px; font-size: 14.5px; border-radius: 13px; }
  .login-sheet h2 { position: relative; padding-right: 44px; }
  .sheet-close {
    position: absolute; right: 16px; top: 12px; width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;

  }
  .pass-wrap { position: relative; }
  .pass-wrap input { padding-right: 44px; }
  .eye-btn {

  .eye-btn:active { transform: translateY(-50%) scale(.88); }

  /* toast */
  .toast {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 60;
    background: rgba(70,25,45,.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);

  /* 图片查看器（灯箱） */
  .imgv {

  .imgv img.zoom { transform: scale(2); }
  .toast.show { opacity: 1; }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .container { max-width: 640px; margin: 0 auto; }
  }
</style>

<script>
(function () {
  'use strict';

  // ---------- 配置 ----------
  const CFG = window.SUPABASE_CONFIG || {};
  const URL_BASE = (CFG.url || '').replace(/\/$/, '');
  const ANON_KEY = CFG.anonKey || '';

  const CATEGORIES = ['洁面', '爽肤水', '精华', '乳液', '面霜', '眼霜', '防晒', '面膜', '卸妆', '底妆', '口红', '眼妆', '香氛', '身体护理', '美发', '工具', '其他'];
  const PLATFORMS = ['淘宝', '京东', '拼多多', '唯品会', '抖音商城', '免税店', '代购', '专柜', '线下门店', '其他'];
  const STATUSES = ['未开封', '已开封', '已超期'];
  const OPENED_OPTS = ['未开封', '已开封'];
  const CATEGORY_COLORS = {
    '洁面':'#7fb5a3','爽肤水':'#6fa8c9','精华':'#c9825e','乳液':'#d8b36a','面霜':'#d98aa6',
    '眼霜':'#b48ec9','防晒':'#e8b04b','面膜':'#8fb878','卸妆':'#9a8fc4','底妆':'#d99a7e',
    '口红':'#c2546a','眼妆':'#6b6b8d','香氛':'#c98fd4','身体护理':'#7db8c9','美发':'#c9a06f',
    '工具':'#98a3ad','其他':'#b09a88'
  };

  // ---------- 状态 ----------
  const PASS_KEY = 'beauty_pass_hash';
  let owner = localStorage.getItem(PASS_KEY) || localStorage.getItem('beauty_owner');
  if (!owner) { owner = (crypto.randomUUID ? crypto.randomUUID() : ('u-' + Date.now() + Math.random().toString(16).slice(2))); localStorage.setItem('beauty_owner', owner); }

  const state = {
    all: [],        // 全量数据（云端拉取 / 本地缓存恢复）
    view: [],       // 当前筛选后的视图数据（固定按金额降序排）
    hasCache: false, // 本地是否存有快照（网络失败时降级展示）
    filter: { category: '全部', status: '全部', search: '' },
    editingId: null,
    pendingImage: null,
    origImageUrl: null  // 编辑开始时的原图片地址（保存换新图后用于清理旧文件）
  };

  // ---------- 工具 ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtMoney = (n) => { n = Number(n) || 0; return n.toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); };

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function todayStr() {
    const t = new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }
  function fmtDateCN(s) {
    if (!s) return '';
    const p = s.split('-');
    return (+p[0]) + '年' + (+p[1]) + '月' + (+p[2]) + '日';
  }

  function timeSince(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    const now = new Date();
    const days = Math.floor((now.getTime() - d.getTime()) / 86400000);
    if (days < 0) return '未来日期';
    if (days === 0) return '今天';
    if (days < 30) return days + '天';
    if (days < 365) { const m = Math.floor(days / 30); return m + '个月'; }
    const y = Math.floor(days / 365); const m = Math.floor((days % 365) / 30);
    return m > 0 ? y + '年' + m + '个月' : y + '年';
  }

  // 开封状态：显式记录（opened 字段）；老数据无该字段时按开封日期兜底
  function isOpened(c) { return c.opened === true || (c.opened == null && !!c.opened_at); }
  // 到期状态：直接看到期日期，不再按开封时间推算；已过=over，60 天内=soon
  function expireState(c) {
    if (!c.expire_date) return '';
    const days = Math.ceil((new Date(c.expire_date + 'T00:00:00').getTime() - Date.now()) / 86400000);
    if (days < 0) return 'over';
    if (days <= 60) return 'soon';
    return '';
  }

  // ---------- API ----------
  function authHeaders(extra) {
    return Object.assign({ apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY }, extra || {});
  }
  function assertCfg() {
    if (!URL_BASE || !ANON_KEY || ANON_KEY.indexOf('你的') >= 0) {
      toast('请先在 config.js 填入 Supabase URL 和 anonKey');
      throw new Error('config missing');
    }
  }

  async function fetchCosmetics() {
    assertCfg();
    // 一次拉全量，筛选/排序全部本地做（数据量小：切筛选零网络请求，离线快照也能筛）
    const url = URL_BASE + '/rest/v1/cosmetics?owner=eq.' + encodeURIComponent(owner) + '&select=*&order=created_at.desc';
    const res = await fetch(url, { headers: authHeaders() });
    if (!res.ok) throw new Error('查询失败 ' + res.status);
    state.all = await res.json();
  }

  // 本地视图：全量 → 筛选 → 按金额降序
  function applyView() {
    state.view = state.all.filter(matchesFilter);
    sortLocal();
    saveCache();   // 视图状态（筛选）与数据变化都同步进缓存，下次打开恢复上次视图
  }

  // ---------- 本地快照缓存（秒开 + 离线兜底） ----------
  function cacheKey() { return 'beauty_cache::' + owner; }
  function saveCache() {
    try {
      localStorage.setItem(cacheKey(), JSON.stringify({ t: Date.now(), list: state.all, filter: state.filter }));
      state.hasCache = true;
    } catch (e) { /* 存储不可用（隐私模式/空间满）不影响主流程 */ }
  }
  function restoreCache() {
    try {
      const raw = localStorage.getItem(cacheKey());
      if (!raw) return;
      const c = JSON.parse(raw);
      if (!c || !Array.isArray(c.list)) return;
      state.all = c.list;
      if (c.filter && c.filter.category && c.filter.status) state.filter = { category: c.filter.category, status: c.filter.status, search: typeof c.filter.search === 'string' ? c.filter.search : '' };
      state.hasCache = true;
      renderCats(); renderTags();
      $('#search-input').value = state.filter.search;
      $('#search-bar').classList.toggle('has-value', !!state.filter.search);
      applyView(); renderGrid();
    } catch (e) { /* 缓存损坏则忽略，走正常网络加载 */ }
  }

  // 尽力清理 storage 里的图片文件（失败不阻断，仅控制台提示）
  function cleanStorageImage(url) {
    if (!url || url.indexOf('/storage/v1/object/public/cosmetics/') < 0) return;
    const objPath = url.split('/storage/v1/object/public/cosmetics/')[1];
    fetch(URL_BASE + '/storage/v1/object/cosmetics/' + objPath, { method: 'DELETE', headers: authHeaders() })
      .then(r => { if (!r.ok) console.warn('图片清理未成功 ' + r.status); })
      .catch(() => {});
  }

  async function saveCosmetic(data) {
    assertCfg();
    let res;
    if (state.editingId) {
      res = await fetch(URL_BASE + '/rest/v1/cosmetics?id=eq.' + state.editingId + '&owner=eq.' + encodeURIComponent(owner), {
        method: 'PATCH', headers: authHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=representation' }), body: JSON.stringify(data)
      });
    } else {
      res = await fetch(URL_BASE + '/rest/v1/cosmetics', {
        method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=representation' }), body: JSON.stringify(Object.assign({ owner: owner }, data))
      });
    }
    if (!res.ok) throw new Error('保存失败 ' + res.status);
    return (await res.json())[0];
  }

  async function removeCosmetic(id) {
    assertCfg();
    const res = await fetch(URL_BASE + '/rest/v1/cosmetics?id=eq.' + id + '&owner=eq.' + encodeURIComponent(owner), { method: 'DELETE', headers: authHeaders() });
    if (!res.ok) throw new Error('删除失败 ' + res.status);
  }

  // 本地排序：固定金额降序（同价时新录入在前）
  function sortLocal() {
    state.view.sort((a, b) => {
      const pa = Number(a.price) || 0, pb = Number(b.price) || 0;
      if (pa !== pb) return pb - pa;
      return String(b.created_at || '').localeCompare(String(a.created_at || ''));
    });
  }

  // 记录是否匹配当前筛选（applyView 本地筛选视图时使用）
  function matchesFilter(c) {
    if (state.filter.category !== '全部' && c.category !== state.filter.category) return false;
    const q = state.filter.search.trim().toLowerCase();
    if (q && !(c.name || '').toLowerCase().includes(q)) return false;
    if (state.filter.status !== '全部') {
      if (state.filter.status === '未开封' && isOpened(c)) return false;
      if (state.filter.status === '已开封' && !isOpened(c)) return false;
      if (state.filter.status === '已超期' && expireState(c) !== 'over') return false;
    }
    return true;
  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 900;
        let w = img.naturalWidth, h = img.naturalHeight;
        const ratio = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * ratio); h = Math.round(h * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        // 优先 WebP（同画质体积约省一半）；老浏览器不支持编码时会回退成 PNG，此时改走 JPEG
        canvas.toBlob(b => {
          if (!b) return reject(new Error('压缩失败'));
          if (b.type === 'image/webp') return resolve(b);
          canvas.toBlob(b2 => b2 ? resolve(b2) : reject(new Error('压缩失败')), 'image/jpeg', 0.78);
        }, 'image/webp', 0.8);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  async function uploadImage(blob) {
    assertCfg();
    const ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
    const path = owner + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now()) + '.' + ext;
    const res = await fetch(URL_BASE + '/storage/v1/object/cosmetics/' + path, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': blob.type || 'image/jpeg' }),
      body: blob
    });
    if (!res.ok) throw new Error('图片上传失败 ' + res.status);
    return URL_BASE + '/storage/v1/object/public/cosmetics/' + path;
  }

  // ---------- 渲染 ----------
  const catIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="width:40px;height:40px"><path d="M10 3h4v3h-4z"/><path d="M8 6h8v3H8z"/><path d="M7 9h10v10a2.5 2.5 0 0 1-2.5 2.5h-5A2.5 2.5 0 0 1 7 19V9z"/></svg>';
  // 占位图标（无图 / 图片加载失败时显示）
  const phHtml = catIcon.replace('style="width:40px;height:40px"', 'style="width:40px;height:40px" class="ph"');
  const emptyArtSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="url(#eg)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0648c"/><stop offset="1" stop-color="#b03a63"/></linearGradient></defs><path d="M10 3h4v3h-4z"/><path d="M8 6h8v3H8z"/><path d="M7 9h10v10a2.5 2.5 0 0 1-2.5 2.5h-5A2.5 2.5 0 0 1 7 19V9z"/></svg>';

  function renderCats() {
    const el = $('#cats'); el.innerHTML = '';
    ['全部', ...CATEGORIES].forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (state.filter.category === c ? ' on' : '');
      b.textContent = c;
      b.onclick = () => { state.filter.category = c; renderCats(); applyView(); renderGrid(); };
      el.appendChild(b);
    });
  }

  function renderTags() {
    const el = $('#tags'); el.innerHTML = '';
    ['全部', ...STATUSES].forEach(s => {
      const b = document.createElement('button');
      b.className = 'tag' + (s === '全部' ? ' reset' : '') + (state.filter.status === s ? ' on' : '');
      b.textContent = s === '全部' ? '状态不限' : s;
      b.onclick = () => { state.filter.status = s; renderTags(); applyView(); renderGrid(); };
      el.appendChild(b);
    });
  }

  // 卡片右下角的开封/到期状态 pill（到期信息直接来自到期日期，不再推算）
  function statusPill(c) {
    const st = expireState(c);
    const cls = st === 'over' ? ' over' : (st === 'soon' ? ' soon' : '');
    const suffix = st === 'over' ? ' · 已超期' : (st === 'soon' ? ' · 快到期' : '');
    if (isOpened(c)) {
      const t = c.opened_at ? timeSince(c.opened_at) : '';
      return '<span class="age-pill' + cls + '">' + (t ? '开封' + t : '已开封') + suffix + '</span>';
    }
    const t = timeSince(c.purchased_at);
    return '<span class="age-pill' + cls + '">' + (t || '未开封') + suffix + '</span>';
  }

  function renderGrid() {
    const el = $('#grid');
    const list = state.view;
    const total = list.reduce((s, c) => s + (Number(c.price) || 0), 0);
    const opened = list.filter(c => isOpened(c)).length;
    $('#stat-count').textContent = list.length;
    $('#stat-total').textContent = '¥' + fmtMoney(total);
    $('#stat-opened').textContent = opened;

    if (!list.length) {
      const q = state.filter.search.trim();
      el.innerHTML = '<div class="empty">' +
        '<div class="art">' + emptyArtSvg + '</div>' +
        '<div class="t">' + (q ? '没有找到相关美妆' : '梳妆台还空着') + '</div>' +
        '<div class="s">' + (q ? '换个关键词试试' : '拍张照片，把美妆收进来') + '</div>' +
        (q ? '' : '<button class="empty-btn" id="empty-add">＋ 添加第一件</button>') +
      '</div>';
      if (!q) $('#empty-add').onclick = openAdd;
      return;
    }
    el.innerHTML = list.map((c, i) => {
      const img = c.image_url ? '<img src="' + esc(c.image_url) + '" loading="lazy" alt="">' : phHtml;
      const price = Number(c.price) || 0;
      const catColor = CATEGORY_COLORS[c.category] || '#b09a88';
      const meta =
        (c.shade ? '<span class="shpill">' + esc(c.shade) + '</span>' : '') +
        (c.capacity ? '<span class="cpill">' + esc(c.capacity) + '</span>' : '') +
        (c.platform ? '<span class="ppill">' + esc(c.platform) + '</span>' : '');
      return '<div class="card" style="animation-delay:' + Math.min(i * 45, 400) + 'ms" data-id="' + esc(c.id) + '">' +
        '<div class="thumb">' + img +
          '<span class="cat-badge" style="--cc:' + catColor + '">' + esc(c.category) + '</span>' +
          '<span class="del" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></span>' +
        '</div>' +
        '<div class="body">' +
          '<div class="name">' + esc(c.name) + '</div>' +
          '<div class="meta">' + meta + '</div>' +
          '<div class="foot">' +
            '<span class="price-badge"><small>¥</small>' + fmtMoney(price) + '</span>' +
            statusPill(c) +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    // 图片加载失败兜底：换成分类占位图标，避免整页裂图
    el.querySelectorAll('.thumb img').forEach(im => {
      im.addEventListener('error', () => {
        const box = document.createElement('div');
        box.innerHTML = phHtml;
        im.replaceWith(box.firstChild);
      });
    });
    el.querySelectorAll('.card').forEach(card => {
      const id = card.dataset.id;
      const item = list.find(x => x.id === id);
      card.onclick = (e) => {
        if (e.target.closest('.del')) { askDelete(id); return; }
        if (e.target.closest('.thumb img')) {
          $('#imgv-img').src = item.image_url;
          $('#imgv').classList.add('show');
          return;
        }
        openEdit(item);
      };
    });
  }

  let lastSync = 0;
  async function load() {
    try {
      await fetchCosmetics();
      applyView();
      renderGrid();
      lastSync = Date.now();
    } catch (e) {
      console.error(e);
      if (e.message === 'config missing') {
        toast('Supabase 配置缺失，请检查 config.js');
        return;
      }
      // 网络/服务不可达：国内访问 Supabase（新加坡）可能不稳定
      if (state.hasCache) {
        // 本地有快照：继续展示快照（筛选/排序仍可用），仅提示
        toast('连接云端失败，当前为本地快照');
      } else {
        toast('连接云端失败，请检查网络');
        $('#grid').innerHTML = '<div class="empty"><div class="art">' + emptyArtSvg + '</div><div class="t">连接云端失败</div><div class="s">多为网络波动，稍后重试即可</div><button class="empty-btn" id="empty-retry">↻ 重新加载</button></div>';
        $('#empty-retry').onclick = () => load();
      }
    }
  }

  // 回前台自动静默刷新（多设备间保持同步）；10 秒内不重复拉
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastSync > 10000) load();
  });
  // ---------- 表单 ----------
  function openSheet() {
    const sheet = $('#sheet');
    sheet.scrollTop = 0;   // 每次打开回到顶部
    sheet.classList.add('show');
    $('#mask').classList.add('show');
  }
  function closeSheet() {
    $('#sheet').classList.remove('show');
    $('#mask').classList.remove('show');
    state.editingId = null; state.pendingImage = null;
    closeCalendar();
    closePf();
  }

  function buildSeg(elId, items, getCurrent, setCurrent) {
    const el = document.getElementById(elId); el.innerHTML = '';
    items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'opt' + (getCurrent() === it ? ' on' : '');
      b.textContent = it;
      b.onclick = () => { setCurrent(it); buildSeg(elId, items, getCurrent, setCurrent); };
      el.appendChild(b);
    });
  }

  let formCat = CATEGORIES[0];
  let formDate = '';         // 购入日期 'YYYY-MM-DD' 或 ''
  let formOpenDate = '';     // 开封日期
  let formOpened = '未开封'; // 开封状态：未开封 / 已开封
  let formExpDate = '';      // 到期日期 'YYYY-MM-DD' 或 ''
  let formPlatform = '';     // 购入渠道
  let tempPlatform = '';

  function renderDateField() {
    $('#f-date').value = formDate ? fmtDateCN(formDate) : '';
    $('#f-date').closest('.date-field').classList.toggle('has-value', !!formDate);
    $('#f-open-date').value = formOpenDate ? fmtDateCN(formOpenDate) : '';
    $('#f-open-date').closest('.date-field').classList.toggle('has-value', !!formOpenDate);
    $('#f-exp-date').value = formExpDate ? fmtDateCN(formExpDate) : '';
    $('#f-exp-date').closest('.date-field').classList.toggle('has-value', !!formExpDate);
  }

  // 开封状态选择：切回「未开封」时隐藏并清空开封日期
  function buildOpened() {
    buildSeg('f-opened', OPENED_OPTS, () => formOpened, v => {
      formOpened = v;
      if (v === '未开封') formOpenDate = '';
      syncOpenDateField();
      renderDateField();
    });
  }
  function syncOpenDateField() {
    $('#field-open-date').style.display = formOpened === '已开封' ? '' : 'none';
  }

  function openAdd() {
    state.editingId = null; state.pendingImage = null; state.origImageUrl = null;
    $('#sheet-title').textContent = '添加美妆';
    $('#f-name').value = ''; $('#f-price').value = ''; $('#f-note').value = '';
    $('#f-shade').value = ''; $('#f-capacity').value = '';
    formCat = CATEGORIES[0];
    formDate = todayStr();   // 购入日期默认当天，可清空或修改
    formOpenDate = ''; formOpened = '未开封'; formExpDate = ''; formPlatform = '';
    renderDateField();
    renderPfField();
    setPreview(null);
    buildSeg('f-cat', CATEGORIES, () => formCat, v => { formCat = v; });
    buildOpened();
    syncOpenDateField();
    openSheet();
  }

  function openEdit(item) {
    state.editingId = item.id; state.pendingImage = null;
    state.origImageUrl = item.image_url || null;   // 记录原图，保存换图后清理旧文件
    $('#sheet-title').textContent = '编辑美妆';
    $('#f-name').value = item.name || '';
    $('#f-price').value = item.price != null ? item.price : '';
    $('#f-note').value = item.note || '';
    $('#f-shade').value = item.shade || '';
    $('#f-capacity').value = item.capacity || '';
    formCat = item.category || CATEGORIES[0];
    formDate = item.purchased_at || '';
    formOpenDate = item.opened_at || '';
    formOpened = isOpened(item) ? '已开封' : '未开封';   // 老数据无 opened 字段时按开封日期兜底
    formExpDate = item.expire_date || '';
    formPlatform = item.platform || '';
    renderDateField();
    renderPfField();
    setPreview(item.image_url || null);
    buildSeg('f-cat', CATEGORIES, () => formCat, v => { formCat = v; });
    buildOpened();
    syncOpenDateField();
    openSheet();
  }

  function setPreview(src) {
    const box = $('#upload-box');
    const oldImg = box.querySelector('img');
    if (oldImg) oldImg.remove();
    const oldRm = box.querySelector('.rm');
    if (oldRm) oldRm.remove();
    if (src) {
      const img = document.createElement('img'); img.src = src;

    const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth, 0).getDate();
    const today = todayStr();
    let html = '';
    for (let i = 0; i < firstDay; i++) html += '<span></span>';
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = calYear + '-' + String(calMonth).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const weekend = (firstDay + d - 1) % 7 === 0 || (firstDay + d - 1) % 7 === 6;
      const cls = 'cal-d' + (weekend ? ' cal-weekend' : '') + (ds === today ? ' today' : '') + (ds === tempDate ? ' sel' : '');
      const future = (ds > today && calTarget !== 'expire') ? ' disabled' : '';
      html += '<button class="' + cls + '" data-d="' + ds + '"' + future + '>' + d + '</button>';

  // 手输日期解析：支持 2024-05-20 / 2024年5月20日 / 2024.5.20 / 20240520 / 5-20（默认今年）；默认不允许未来日期，allowFuture 用于到期日期（未来 10 年内）
  function parseDateInput(str, allowFuture) {
    str = (str || '').trim().toLowerCase();
    if (!str) return '';
    let y = null, mo = null, d = null;
    let m = str.match(/^(\d{4})\s*[-/.年 ]\s*(\d{1,2})\s*[-/.月 ]\s*(\d{1,2})\s*日?$/);
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    if (y == null) { m = str.match(/^(\d{4})(\d{2})(\d{2})$/); if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; } }
    if (y == null) { m = str.match(/^(\d{1,2})\s*[-/.月 ]\s*(\d{1,2})\s*日?$/); if (m) { y = new Date().getFullYear(); mo = +m[1]; d = +m[2]; } }
    if (y == null) return '';
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return '';
    const s = y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const maxD = allowFuture ? (new Date().getFullYear() + 10) + '-12-31' : todayStr();
    if (s > maxD || y < CAL_MIN.y) return '';
    return s;
  }
  function bindDateInput(input, target) {
    const allowFuture = target === 'expire';
    input.addEventListener('input', () => {
      const s = parseDateInput(input.value, allowFuture);
      if (s) { setFormDate(target, s); renderDateField(); }
    });
    input.addEventListener('blur', () => {
      if (!input.value.trim()) { setFormDate(target, ''); renderDateField(); return; }
      const s = parseDateInput(input.value, allowFuture);
      if (s) setFormDate(target, s);
      else toast('日期格式：2024-05-20 或 5月20日');
      renderDateField();
    });
  }

  async function hashPass(pass) {
    const data = new TextEncoder().encode('beauty-h5-salt-v1::' + pass);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
  }
  async function migrateOwner(to) {
    if (owner === to) return 0;
    const res = await fetch(URL_BASE + '/rest/v1/cosmetics?owner=eq.' + encodeURIComponent(owner) + '&select=id', { headers: authHeaders() });
    if (!res.ok) throw new Error('查询失败 ' + res.status);
    const rows = await res.json();
    if (!rows.length) return 0;
    const res2 = await fetch(URL_BASE + '/rest/v1/cosmetics?id=in.(' + rows.map(r => r.id).join(',') + ')', {
      method: 'PATCH', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ owner: to })
    });
    if (!res2.ok) throw new Error('数据迁移失败 ' + res2.status);
    return rows.length;
  }

    const keys = ['name', 'brand', 'category', 'capacity', 'shade', 'color', 'skin', 'usage_time', 'price', 'purchased_at', 'platform', 'opened', 'opened_at', 'expire_date', 'note', 'image_url', 'created_at'];

      return s;
    };
    let csv = '\uFEFF' + cols.join(',') + '\r\n';   // BOM 头，Excel 直接打开不乱码
    state.all.forEach(r => { csv += keys.map(k => cell(r[k])).join(',') + '\r\n'; });
    downloadFile('beauty-' + dateStamp() + '.csv', 'text/csv;charset=utf-8', csv);
    toast('已导出 CSV');
  };

  // ---------- 初始化 ----------
  renderCats();
  renderTags();
  renderLoginBtn();
  restoreCache();   // 本地有快照则先秒显上次的视图（含筛选状态）
  load();           // 再拉云端，成功后覆盖渲染并更新快照
})();
</script>
</body>
</html>
